---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: myingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /nginx
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          - path: /httpd
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80

          - path: /shaikmustafa/cycle
            pathType: Prefix
            backend:
              service:
                name: db-service
                port:
                  number: 80
